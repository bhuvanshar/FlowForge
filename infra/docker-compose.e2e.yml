# End-to-end test overlay. Never use it for real data: it lets the backend call a private address (the mock container).
#
#   scripts/e2e.sh    # builds the stack under the separate project name "flowforge-e2e", runs Playwright, removes it
#
# Adds mock-services (echo/status/delay endpoints and an OpenAI-compatible chat endpoint) and points the outbound
# allowlist at it. Everything else is the normal docker-compose.yml, so the suite exercises the real images.
services:
  mock-services:
    profiles: ["app"]
    image: node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    command: ["node", "/srv/server.mjs"]
    read_only: true
    volumes:
      - ../e2e/mock-services:/srv:ro
    ports:
      # Tests read /_requests to see what the backend actually sent.
      - "127.0.0.1:${MOCK_PORT:-28090}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 2s
      timeout: 2s
      retries: 15

  backend:
    depends_on:
      mock-services:
        condition: service_healthy
    environment:
      FLOWFORGE_HTTP_ALLOWED_HOSTS: mock-services
      # The mock runs on the private compose network; production keeps this false.
      FLOWFORGE_HTTP_ALLOW_PRIVATE_ADDRESSES: "true"
