server {
    listen 80;
    server_tokens off;
    # Above the backend limits (1 MiB API, 256 KiB webhooks), so the backend answers with a Problem Detail.
    client_max_body_size 2m;
    root /usr/share/nginx/html;
    index index.html;

    # Server-Sent Events: no buffering, HTTP/1.1 keep-alive, long read timeout (the backend sends a heartbeat every 15 s).
    location ~ ^/api/v1/executions/[^/]+/events$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
